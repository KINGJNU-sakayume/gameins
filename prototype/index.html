<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLAIM DENIED 손해사정 책상</title>
  <meta name="description" content="손해사정 게임 CLAIM DENIED 프로토타입. 책상 위 서류를 끌어다 대조하고 판정서를 제출한다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Archivo:wght@400;500&family=Archivo+Narrow:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#desk">책상으로 건너뛰기</a>
  <header class="window">
    <div class="window__in">
      <div class="ticket" id="ticket">
        <p class="ticket__no">CLAIM DENIED</p>
        <p class="ticket__meta">스크립트를 켜면 사건이 접수됩니다.</p>
      </div>
      <nav class="cases" aria-label="사건 선택" id="cases"></nav>
      <dl class="clock">
        <div><dt>근무일</dt><dd id="day" class="num">1일차</dd></div>
        <div><dt>조사 자원</dt><dd id="res" class="num">10 / 10</dd></div>
      </dl>
      <button class="btn btn--onink" type="button" data-act="endday">근무 종료</button>
    </div>
  </header>
  <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>
  <main class="room">
    <section class="desk" id="desk" aria-label="책상">
      <div class="desk__tools">
        <button class="btn btn--desk" type="button" data-act="tidy">가지런히</button>
        <p class="desk__hint">서류를 끌어 옮기고, 나란히 놓고 대조하세요. 판정서로 끌어 놓으면 근거로 첨부됩니다.</p>
      </div>
      <div class="desk__surface" id="surface">
        <noscript><p class="desk__hint">서류를 펼치고 판정하려면 브라우저에서 스크립트를 켜야 합니다.</p></noscript>
      </div>
      <aside class="tray" id="tray" aria-label="서류함, 조사 요청"></aside>
    </section>
    <section class="sheet-col" id="verdict" aria-label="판정서"></section>
  </main>
  <button class="jump" type="button" id="jump" data-act="jump">판정서로</button>
  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
